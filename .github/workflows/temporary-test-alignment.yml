name: Temporary test alignment

on:
  push:
    branches:
      - fix/issue-001-cross-browser-password-recovery

permissions:
  contents: write

jobs:
  align-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/issue-001-cross-browser-password-recovery
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply exact test-only alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = Path('src/tests/auth-routes.test.tsx')
          old = '重置密码链接无效或已过期，请重新申请。'
          new = '当前浏览器没有有效的密码恢复会话，请从最新一封密码重置邮件重新进入。'
          text = routes.read_text(encoding='utf-8')
          assert text.count(old) == 1, 'expected exactly one legacy recovery assertion'
          routes.write_text(text.replace(old, new), encoding='utf-8')

          recovery = Path('src/tests/password-recovery-confirm.test.tsx')
          race = '    expect(supabase.authEventListeners.length).toBeGreaterThan(0)\n'
          text = recovery.read_text(encoding='utf-8')
          assert text.count(race) == 1, 'expected exactly one listener race assertion'
          recovery.write_text(text.replace(race, ''), encoding='utf-8')
          PY
          npx prettier --write src/tests/auth-routes.test.tsx src/tests/password-recovery-confirm.test.tsx
          git diff --check
          git diff --exit-code -- . ':!src/tests/auth-routes.test.tsx' ':!src/tests/password-recovery-confirm.test.tsx'
      - name: Commit exact test-only alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tests/auth-routes.test.tsx src/tests/password-recovery-confirm.test.tsx
          git commit -m 'test(auth): align recovery regression coverage'
          git push origin HEAD:fix/issue-001-cross-browser-password-recovery
