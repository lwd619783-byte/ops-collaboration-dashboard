name: Activation recovery format diagnose

on:
  push:
    branches:
      - fix/workspace-activation-reconciliation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/tests/workspace-activation-reconciliation.test.tsx
          git diff -- src/tests/workspace-activation-reconciliation.test.tsx
          test -z "$(git diff --name-only -- src/tests/workspace-activation-reconciliation.test.tsx)"
