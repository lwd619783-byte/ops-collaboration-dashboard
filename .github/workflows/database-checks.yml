name: Database checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Run database checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase stack
        run: npx supabase start
      - name: Verify migrations, tests, lint, and types
        run: npm run db:verify
      - name: Run real Auth invitation-reissue integration checks
        run: npm run db:reissue:verify
      - name: Stop local database
        if: always()
        run: npx supabase stop --no-backup
