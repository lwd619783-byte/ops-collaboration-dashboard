name: Return-to format diagnose

on:
  push:
    branches:
      - fix/auth-return-to-deep-links

permissions:
  contents: read

jobs:
  diagnose:
    name: Show Prettier diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show exact Prettier changes
        run: |
          npx prettier --write src/tests/return-to.test.ts
          git diff --check
          git diff --exit-code -- src/tests/return-to.test.ts
