name: Edge Function checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-function-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Run invitation function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Edge Function handler tests
        run: npm run test:edge
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # Fixed Deno 2 release, compatible with the Supabase Edge Runtime
          # (hosted runtime runs Deno 2.1+). Never float an unpinned version.
          deno-version: 2.2.12
      - name: Type-check the real Edge Function entry
        run: deno check supabase/functions/invite-workspace-member/index.ts
