name: Hosted reissue format diagnose

on:
  push:
    branches:
      - fix/hosted-invite-reissue-fail-closed

permissions:
  contents: read

jobs:
  diagnose:
    name: Show Prettier diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show exact Prettier changes
        run: |
          npx prettier --write supabase/functions/invite-workspace-member/hosted-reissue-fail-closed.test.ts
          git diff --check
          git diff --exit-code -- supabase/functions/invite-workspace-member/hosted-reissue-fail-closed.test.ts
