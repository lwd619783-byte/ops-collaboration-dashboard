<!doctype html>
<html lang="zh-CN">
  <body>
    <h2>重置运维协同看板密码</h2>
    <p>我们收到了密码重置请求。</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/recovery#token_hash={{ .TokenHash }}&type=recovery"
      >
        继续重置密码
      </a>
    </p>
    <p>打开页面后仍需由你主动确认，系统才会验证一次性重置凭据。</p>
    <p>
      如果你多次申请，请只使用最新一封邮件；如果并非你本人申请，可以忽略本邮件。
    </p>
  </body>
</html>
