name: Temporary Prettier diagnostic

on:
  push:
    branches:
      - fix/issue-001-cross-browser-password-recovery

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Produce exact Prettier diff
        run: |
          npx prettier --write src/tests/password-recovery-confirm.test.tsx supabase/templates/recovery.html
          git diff -- src/tests/password-recovery-confirm.test.tsx supabase/templates/recovery.html
          test -z "$(git status --porcelain -- src/tests/password-recovery-confirm.test.tsx supabase/templates/recovery.html)"
