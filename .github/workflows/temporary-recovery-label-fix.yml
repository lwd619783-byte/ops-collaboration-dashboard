name: Temporary recovery label test fix

on:
  push:
    branches:
      - fix/issue-001-cross-browser-password-recovery

permissions:
  contents: write

jobs:
  fix-test-selector:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/issue-001-cross-browser-password-recovery
      - name: Apply exact test selector fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tests/password-recovery-confirm.test.tsx')
          text = path.read_text(encoding='utf-8')
          old_password = "    const password = await screen.findByLabelText('新密码')\n"
          old_confirmation = "    const confirmation = screen.getByLabelText('确认新密码')\n"
          assert text.count(old_password) == 1
          assert text.count(old_confirmation) == 1
          text = text.replace(old_password, "    const password = await screen.findByLabelText(/^新密码/)\n")
          text = text.replace(old_confirmation, "    const confirmation = screen.getByLabelText(/^确认新密码/)\n")
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code -- . ':!src/tests/password-recovery-confirm.test.tsx'
      - name: Commit test selector fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tests/password-recovery-confirm.test.tsx
          git commit -m 'test(auth): match required recovery labels'
          git push origin HEAD:fix/issue-001-cross-browser-password-recovery
